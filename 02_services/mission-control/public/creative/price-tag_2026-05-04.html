<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wine & Whiskey — Price Tag Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Print page = single tag 50×60mm. Screen layout previews multiple tags on a sheet. */
  @page { size: 50mm 60mm; margin: 0; }

  :root {
    --wine-red: #8C1C1C;
    --burgundy-deep: #5C1010;
    --deep-black: #1A1A1A;
    --warm-white: #F5F0EB;
    --cream: #EDE0D0;
    --amber: #C9A84C;
    --graphite: #3D3D3D;
    --pale-stone: #D4C9BC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #2a2a2a;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--deep-black);
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
  }

  /* ── Tag 50×60mm portrait ───────────────────────────────── */
  .tag {
    width: 50mm;
    height: 60mm;
    background: var(--cream);
    color: var(--deep-black);
    padding: 3.5mm 3.5mm 3mm;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  .tag__overline {
    font-family: 'Inter', sans-serif;
    font-size: 6pt;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--graphite);
    margin-bottom: 1.8mm;
  }

  .tag__name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 13pt;
    line-height: 1.05;
    color: var(--deep-black);
    margin-bottom: 1.2mm;
    /* Allow up to 3 lines for long names */
    word-wrap: break-word;
  }

  .tag__grape {
    font-family: 'Inter', sans-serif;
    font-size: 7.5pt;
    font-weight: 400;
    line-height: 1.3;
    color: var(--graphite);
  }

  .tag__price {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 1mm;
    line-height: 1;
  }

  .tag__price-num {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 34pt;
    line-height: 0.85;
    color: var(--deep-black);
    letter-spacing: 0.01em;
  }

  .tag__price-cur {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18pt;
    color: var(--graphite);
    letter-spacing: 0.02em;
  }

  .tag__discount {
    margin-top: 2.5mm;
    padding-top: 2mm;
    border-top: 0.4mm solid var(--pale-stone);
    font-family: 'Inter', sans-serif;
    font-size: 6.5pt;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--wine-red);
    text-align: center;
    text-transform: uppercase;
  }

  /* ── Variant: dark mode tag (alternative) ───────────────── */
  .tag--dark {
    background: var(--deep-black);
    color: var(--warm-white);
  }
  .tag--dark .tag__overline { color: var(--amber); }
  .tag--dark .tag__name { color: var(--warm-white); }
  .tag--dark .tag__grape { color: var(--pale-stone); }
  .tag--dark .tag__price-num { color: var(--warm-white); }
  .tag--dark .tag__price-cur { color: var(--amber); }
  .tag--dark .tag__discount {
    color: var(--amber);
    border-top-color: var(--graphite);
  }

  /* ── Print: one tag per page, no shadows, exact mm sizing ── */
  @media print {
    html, body { background: white; padding: 0; }
    body { display: block; }
    .tag {
      box-shadow: none;
      page-break-after: always;
      margin: 0;
    }
    .preview-label { display: none; }
  }

  .preview-label {
    width: 100%;
    color: #aaa;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
</style>
</head>
<body>

  <div class="group">
    <!-- LIGHT (default) — example: Catena Malbec -->
    <div class="tag">
      <div class="tag__overline">Argentina · Mendoza</div>
      <div class="tag__name">Catena Malbec</div>
      <div class="tag__grape">Malbec</div>

      <div class="tag__price">
        <span class="tag__price-num">1,290</span>
        <span class="tag__price-cur">฿</span>
      </div>

      <div class="tag__discount">−5% on any 2 bottles</div>
    </div>
    <div class="preview-label">Light · 50×60 mm</div>
  </div>

  <div class="group">
    <!-- DARK variant — same data -->
    <div class="tag tag--dark">
      <div class="tag__overline">Argentina · Mendoza</div>
      <div class="tag__name">Catena Malbec</div>
      <div class="tag__grape">Malbec</div>

      <div class="tag__price">
        <span class="tag__price-num">1,290</span>
        <span class="tag__price-cur">฿</span>
      </div>

      <div class="tag__discount">−5% on any 2 bottles</div>
    </div>
    <div class="preview-label">Dark · 50×60 mm</div>
  </div>

</body>
</html>
