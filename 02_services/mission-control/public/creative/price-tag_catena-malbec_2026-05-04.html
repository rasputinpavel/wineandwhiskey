<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wine & Whiskey — Price Tag · Catena Malbec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: 50mm 60mm; margin: 0; }

  :root {
    --wine-red: #8C1C1C;
    --deep-black: #1A1A1A;
    --cream: #EDE0D0;
    --graphite: #3D3D3D;
    --pale-stone: #D4C9BC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: white;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--deep-black);
    -webkit-font-smoothing: antialiased;
  }

  .tag {
    width: 50mm;
    height: 60mm;
    background: var(--cream);
    color: var(--deep-black);
    padding: 3.5mm 3.5mm 3mm;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .tag__overline {
    font-family: 'Inter', sans-serif;
    font-size: 6pt;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--graphite);
    margin-bottom: 1.8mm;
  }

  .tag__name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 13pt;
    line-height: 1.05;
    color: var(--deep-black);
    margin-bottom: 1.2mm;
    word-wrap: break-word;
  }

  .tag__grape {
    font-family: 'Inter', sans-serif;
    font-size: 7.5pt;
    font-weight: 400;
    line-height: 1.3;
    color: var(--graphite);
  }

  .tag__price {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 1mm;
    line-height: 1;
  }

  .tag__price-num {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 34pt;
    line-height: 0.85;
    color: var(--deep-black);
    letter-spacing: 0.01em;
  }

  .tag__price-cur {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18pt;
    color: var(--graphite);
    letter-spacing: 0.02em;
  }

  .tag__discount {
    margin-top: 2.5mm;
    padding-top: 2mm;
    border-top: 0.4mm solid var(--pale-stone);
    font-family: 'Inter', sans-serif;
    font-size: 6.5pt;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--wine-red);
    text-align: center;
    text-transform: uppercase;
  }

  @media print {
    html, body { background: white; }
    .tag { page-break-after: avoid; }
  }
</style>
</head>
<body>
  <div class="tag">
    <div class="tag__overline">Argentina · Mendoza</div>
    <div class="tag__name">Catena Malbec</div>
    <div class="tag__grape">Malbec</div>

    <div class="tag__price">
      <span class="tag__price-num">1,290</span>
      <span class="tag__price-cur">฿</span>
    </div>

    <div class="tag__discount">−5% on any 2 bottles</div>
  </div>
</body>
</html>
