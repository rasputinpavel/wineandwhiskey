<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wine &amp; Whiskey — Menu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    @font-face {
      font-family: 'Bebas Neue';
      src: url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.woff2') format('woff2'),
           url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --black:   #1A1A1A;
      --white:   #F5F0EB;
      --cream:   #EDE0D0;
      --wine:    #8C1C1C;
      --gold:    #C9A84C;
      --stone:   #D4C9BC;
      --graph:   #3D3D3D;
    }

    @page { size: 210mm 297mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card {
      width: 210mm;
      height: 297mm;
      background: var(--black);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18mm 24mm 14mm 24mm;
    }

    /* warm centre glow */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 26%, rgba(201,168,76,0.11) 0%, rgba(201,168,76,0) 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* hairline border frame */
    .frame {
      position: absolute;
      inset: 9mm;
      border: 1px solid var(--graph);
      pointer-events: none;
      z-index: 1;
    }

    /* ---------- HEADER ---------- */
    .header {
      position: relative;
      z-index: 2;
      text-align: center;
      flex-shrink: 0;
    }
    .wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17pt;
      letter-spacing: 0.22em;
      line-height: 1;
    }
    .wordmark .w { color: var(--wine); }
    .wordmark .k { color: var(--white); }
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11pt;
      letter-spacing: 0.50em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 4mm;
    }

    /* ---------- SECTIONS ---------- */
    .menu {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 142mm;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 6mm 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 6mm;
      margin-bottom: 9mm;
    }
    .section-head .label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19pt;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }
    .section-head .rule {
      flex: 1;
      height: 1px;
      background: var(--graph);
    }

    .item {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 10mm;
    }
    .item:last-child { margin-bottom: 0; }

    .item .icon {
      width: 10mm;
      height: 10mm;
      flex-shrink: 0;
      color: var(--gold);
      margin-right: 6mm;
    }
    .item .icon svg { width: 100%; height: 100%; display: block; }

    .item .row-head { display: flex; flex-direction: column; }
    .item .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 29pt;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
      line-height: 1;
    }
    .item .name .accent { color: var(--wine); }
    .item .desc {
      display: block;
      font-size: 9pt;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--stone);
      margin-top: 2.5mm;
      font-family: 'Inter', sans-serif;
    }
    .item .lead {
      flex: 1;
      margin: 0 6mm;
      border-bottom: 1px dotted var(--graph);
      transform: translateY(-1.5mm);
    }
    .item .price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 29pt;
      letter-spacing: 0.02em;
      color: var(--gold);
      white-space: nowrap;
      line-height: 1;
    }
    .item .price .cur {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15pt;
      vertical-align: 2pt;
      margin-right: 1mm;
    }

    /* ---------- FOOTER ---------- */
    .footer {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 142mm;
      flex-shrink: 0;
      padding-top: 4mm;
      border-top: 1px solid var(--graph);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8pt;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
    }
    .footer .right { color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>

    <div class="header">
      <div class="wordmark"><span class="w">WINE</span> <span class="k">&amp; WHISKEY</span></div>
      <div class="title">Menu</div>
    </div>

    <div class="menu">

      <!-- WINE -->
      <div class="section">
        <div class="section-head">
          <span class="label">Wine</span>
          <span class="rule"></span>
        </div>
        <div class="item">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10c0 4.2-2.1 7.2-5 7.2S7 7.2 7 3z"/><line x1="12" y1="10.2" x2="12" y2="19"/><line x1="8" y1="19" x2="16" y2="19"/></svg></span>
          <div class="row-head">
            <span class="name">Wine by Glass</span>
            <span class="desc">Ask the bar for today's pour</span>
          </div>
          <span class="lead"></span>
          <span class="price"><span class="cur">฿</span>200</span>
        </div>
      </div>

      <!-- SPIRITS -->
      <div class="section">
        <div class="section-head">
          <span class="label">Spirits</span>
          <span class="rule"></span>
        </div>
        <div class="item">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8l-1 13H9L8 5z"/><line x1="8.3" y1="9.5" x2="15.7" y2="9.5"/></svg></span>
          <div class="row-head"><span class="name">Vodka Shot</span></div>
          <span class="lead"></span>
          <span class="price"><span class="cur">฿</span>100</span>
        </div>
        <div class="item">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8l-1 13H9L8 5z"/><line x1="8.3" y1="9.5" x2="15.7" y2="9.5"/></svg></span>
          <div class="row-head"><span class="name">Gin Shot</span></div>
          <span class="lead"></span>
          <span class="price"><span class="cur">฿</span>150</span>
        </div>
      </div>

      <!-- COCKTAILS -->
      <div class="section">
        <div class="section-head">
          <span class="label">Cocktails</span>
          <span class="rule"></span>
        </div>
        <div class="item">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l-.6 15H8.6L8 4z"/><circle cx="11" cy="10.5" r="0.7" fill="currentColor" stroke="none"/><circle cx="13.4" cy="13.5" r="0.7" fill="currentColor" stroke="none"/><circle cx="11.4" cy="15.2" r="0.6" fill="currentColor" stroke="none"/></svg></span>
          <div class="row-head">
            <span class="name">Gin &amp; <span class="accent">Tonic</span></span>
            <span class="desc">Gin over ice, topped with tonic &amp; a citrus twist</span>
          </div>
          <span class="lead"></span>
          <span class="price"><span class="cur">฿</span>200</span>
        </div>
        <div class="item">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-8 8-8-8z"/><line x1="12" y1="13" x2="12" y2="19.5"/><line x1="8" y1="19.5" x2="16" y2="19.5"/><circle cx="15.5" cy="6.2" r="0.8" fill="currentColor" stroke="none"/></svg></span>
          <div class="row-head">
            <span class="name"><span class="accent">Special</span> Cocktail</span>
            <span class="desc">Our signature serve — ask the bar</span>
          </div>
          <span class="lead"></span>
          <span class="price"><span class="cur">฿</span>200</span>
        </div>
      </div>

    </div>

    <div class="footer">
      <div>Wine &amp; Whiskey · Phuket</div>
      <div class="right">Open daily 11–22</div>
    </div>

  </div>
</body>
</html>
