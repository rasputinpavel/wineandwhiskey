<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wine &amp; Whiskey — Special Sloe Cocktail</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    @font-face {
      font-family: 'Bebas Neue';
      src: url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.woff2') format('woff2'),
           url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --black:   #1A1A1A;
      --white:   #F5F0EB;
      --wine:    #8C1C1C;
      --gold:    #C9A84C;
      --stone:   #D4C9BC;
      --graph:   #3D3D3D;
    }

    @page { size: 105mm 148mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card {
      width: 105mm;
      height: 148mm;
      background: var(--black);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      width: 100%;
      height: 80mm;
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 36%;
      display: block;
    }
    /* edge vignette — pushes all hero edges into solid #1A1A1A
       so nothing blooms past the photo on any display */
    .hero .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      box-shadow: inset 0 0 14mm 5mm var(--black);
      pointer-events: none;
    }
    .hero .scrim-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 28mm;
      background: linear-gradient(to bottom, rgba(10,10,10,0.74) 0%, rgba(10,10,10,0) 100%);
      z-index: 2;
    }
    .hero .scrim-bot {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 26mm;
      background: linear-gradient(to bottom, rgba(26,26,26,0) 0%, var(--black) 96%);
      z-index: 2;
    }

    .header {
      position: absolute;
      top: 6.5mm; left: 0; right: 0;
      z-index: 4;
      text-align: center;
    }
    .wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13pt;
      letter-spacing: 0.16em;
      line-height: 1;
    }
    .wordmark .w { color: var(--wine); }
    .wordmark .k { color: var(--white); }
    .overline {
      margin-top: 2mm;
      font-size: 5.5pt;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ---------- INFO ---------- */
    .info {
      flex: 1;
      position: relative;
      z-index: 4;
      padding: 0 10mm 8mm 10mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -2mm;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 25pt;
      line-height: 0.9;
      letter-spacing: 0.04em;
      color: var(--white);
      text-transform: uppercase;
    }
    .name .accent { color: var(--wine); }

    .recipe {
      margin-top: 3mm;
      font-size: 7pt;
      line-height: 1.5;
      color: var(--stone);
      max-width: 78mm;
    }

    .price-wrap {
      margin-top: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .price-rule {
      width: 24mm;
      height: 1px;
      background: var(--graph);
      margin: 4mm 0 2mm 0;
    }
    .price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40pt;
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: var(--gold);
    }
    .price .cur {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 18pt;
      vertical-align: 4pt;
      margin-right: 1mm;
    }

    .footer {
      margin-top: 4mm;
      padding-top: 2.5mm;
      border-top: 1px solid var(--graph);
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 5.5pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
    }
    .footer .right { color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">

    <div class="hero">
      <img src="file:///Users/pavelrasputin/Desktop/Wine_Whiskey/05_creative/output/special-sloe-cocktail_2026-06/assets/hero.png" alt="Special Sloe Cocktail" />
      <div class="vignette"></div>
      <div class="scrim-top"></div>
      <div class="scrim-bot"></div>
      <div class="header">
        <div class="wordmark"><span class="w">WINE</span> <span class="k">&amp; WHISKEY</span></div>
        <div class="overline">Signature Serve · Spanish Style</div>
      </div>
    </div>

    <div class="info">
      <div class="name">Special<br/><span class="accent">Sloe</span> Cocktail</div>
      <div class="recipe">Barrister Sloe Gin layered with dark vermouth, poured over ice — finished with an orange wheel &amp; olive on the pick.</div>

      <div class="price-wrap">
        <div class="price-rule"></div>
        <div class="price"><span class="cur">฿</span>200</div>
        <div class="footer">
          <div>Wine &amp; Whiskey · Phuket</div>
          <div class="right">Open daily 11–22</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
