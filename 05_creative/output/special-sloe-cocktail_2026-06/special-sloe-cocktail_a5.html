<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wine &amp; Whiskey — Special Sloe Cocktail (A5)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    @font-face {
      font-family: 'Bebas Neue';
      src: url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.woff2') format('woff2'),
           url('file:///Users/pavelrasputin/Desktop/Wine_Whiskey/04_brand/logo/fonts/BebasNeue.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --bg:     #F5F0EB;
      --text:   #1A1A1A;
      --text2:  #3D3D3D;
      --wine:   #8C1C1C;
      --gold:   #C9A84C;
      --border: #D4C9BC;
    }

    @page { size: 148mm 210mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card {
      width: 148mm;
      height: 210mm;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 13mm 13mm 11mm 13mm;
    }

    /* ---------- HEADER ---------- */
    .wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20pt;
      letter-spacing: 0.16em;
      line-height: 1;
    }
    .wordmark .w { color: var(--wine); }
    .wordmark .k { color: var(--text); }
    .overline {
      margin-top: 3mm;
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: var(--wine);
    }

    /* ---------- HERO ---------- */
    .hero {
      margin-top: 6mm;
      width: 100%;
      height: 80mm;
      border-radius: 3mm;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 3mm 7mm rgba(26,26,26,0.14);
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
      display: block;
    }

    /* ---------- INFO ---------- */
    .name {
      margin-top: 6mm;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34pt;
      line-height: 0.9;
      letter-spacing: 0.04em;
      color: var(--text);
      text-transform: uppercase;
    }
    .name .accent { color: var(--wine); }

    .recipe {
      margin-top: 4mm;
      font-size: 10pt;
      line-height: 1.5;
      color: var(--text2);
      max-width: 104mm;
    }

    .price-wrap {
      margin-top: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .price-rule {
      width: 34mm;
      height: 1px;
      background: var(--border);
      margin: 6mm 0 3mm 0;
    }
    .price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 50pt;
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: var(--wine);
    }
    .price .cur {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 24pt;
      vertical-align: 5pt;
      margin-right: 1.5mm;
    }

    .footer {
      margin-top: 6mm;
      padding-top: 3.5mm;
      border-top: 1px solid var(--border);
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 7.5pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text2);
    }
    .footer .right { color: var(--wine); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">

    <div class="wordmark"><span class="w">WINE</span> <span class="k">&amp; WHISKEY</span></div>
    <div class="overline">Signature Serve · Spanish Style</div>

    <div class="hero">
      <img src="file:///Users/pavelrasputin/Desktop/Wine_Whiskey/05_creative/output/special-sloe-cocktail_2026-06/assets/hero_light.png" alt="Special Sloe Cocktail" />
    </div>

    <div class="name">Special<br/><span class="accent">Sloe</span> Cocktail</div>
    <div class="recipe">Barrister Sloe Gin over ice — topped with fresh orange &amp; olives.</div>

    <div class="price-wrap">
      <div class="price-rule"></div>
      <div class="price"><span class="cur">฿</span>200</div>
      <div class="footer">
        <div>Wine &amp; Whiskey · Phuket</div>
        <div class="right">Open daily 11–22</div>
      </div>
    </div>

  </div>
</body>
</html>
