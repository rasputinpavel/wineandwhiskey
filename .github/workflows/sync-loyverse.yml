name: Sync Loyverse

on:
  schedule:
    # Every 8 hours: 06:30 / 14:30 / 22:30 Bangkok (UTC+7) = 23:30 / 07:30 / 15:30 UTC.
    # One run right after close (22:30 BKK) for same-evening day totals.
    - cron: "30 7,15,23 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Loyverse REST sync is fast (~30s)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Loyverse → inventory schema
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOYVERSE_API_TOKEN:  ${{ secrets.LOYVERSE_API_TOKEN }}
        run: npm run inv:loyverse
