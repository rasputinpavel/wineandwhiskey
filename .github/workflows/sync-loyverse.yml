name: Sync Loyverse

on:
  schedule:
    # Every 8 hours: 00:00 / 08:00 / 16:00 Bangkok (UTC+7) = 17 / 01 / 09 UTC
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Loyverse REST sync is fast (~30s)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Loyverse → inventory schema
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOYVERSE_API_TOKEN:  ${{ secrets.LOYVERSE_API_TOKEN }}
        run: npm run inv:loyverse
