name: Sync Cashflow Actuals

on:
  schedule:
    # 22:15 Bangkok time = 15:15 UTC — Sundays only
    - cron: "15 15 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync cashflow actuals (last week retail revenue)
        env:
          LOYVERSE_API_TOKEN:      ${{ secrets.LOYVERSE_API_TOKEN }}
          GOOGLE_CLIENT_ID:        ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:    ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:    ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: npm run actuals
