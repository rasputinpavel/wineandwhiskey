name: Sync Loyverse Receipts

on:
  schedule:
    # 3×/день: 06:30 / 14:30 / 22:30 Bangkok (UTC+7) = 23:30 / 07:30 / 15:30 UTC.
    # Последний прогон — сразу после закрытия магазина (итоги дня в тот же вечер).
    - cron: "30 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "LOYVERSE_FROM (YYYY-MM-DD)"
        required: false
      to:
        description: "LOYVERSE_TO (YYYY-MM-DD)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sync Loyverse receipts → inventory schema
        env:
          LOYVERSE_API_TOKEN:   ${{ secrets.LOYVERSE_API_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOYVERSE_FROM:        ${{ inputs.from }}
          LOYVERSE_TO:          ${{ inputs.to }}
        run: npm run inv:receipts
