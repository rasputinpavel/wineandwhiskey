name: Sync Loyverse Receipts

on:
  schedule:
    # 3×/день: 06:30 / 14:30 / 22:30 Bangkok (UTC+7) = 23:30 / 07:30 / 15:30 UTC.
    # Последний прогон — сразу после закрытия магазина (итоги дня в тот же вечер).
    - cron: "30 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "LOYVERSE_FROM (YYYY-MM-DD)"
        required: false
      to:
        description: "LOYVERSE_TO (YYYY-MM-DD)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sync Loyverse receipts → inventory schema
        env:
          LOYVERSE_API_TOKEN:   ${{ secrets.LOYVERSE_API_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOYVERSE_FROM:        ${{ inputs.from }}
          LOYVERSE_TO:          ${{ inputs.to }}
        run: npm run inv:receipts

      # Bust the portal's shared receipt cache so fresh receipts show up at once
      # instead of waiting out the 10-minute revalidate. Non-fatal: skipped when
      # the secrets aren't configured, never fails the sync.
      - name: Bust portal receipt cache
        if: success()
        env:
          PORTAL_URL:                 ${{ secrets.PORTAL_URL }}
          RECEIPTS_REVALIDATE_SECRET: ${{ secrets.RECEIPTS_REVALIDATE_SECRET }}
        run: |
          if [ -z "$PORTAL_URL" ] || [ -z "$RECEIPTS_REVALIDATE_SECRET" ]; then
            echo "PORTAL_URL / RECEIPTS_REVALIDATE_SECRET not set — skipping cache bust"
            exit 0
          fi
          curl -fsS -X POST "$PORTAL_URL/api/public/revalidate" \
            -H "Authorization: Bearer $RECEIPTS_REVALIDATE_SECRET" \
            && echo "portal cache revalidated" \
            || echo "revalidate ping failed (non-fatal)"
