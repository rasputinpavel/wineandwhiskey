name: Scrape Purchase Orders

on:
  schedule:
    # 02:00 Bangkok time (UTC+7) = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Extra args (e.g. '--all', '--no-discover', '--discover-pages 10', '--po PO2890')"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Decode the persisted Loyverse session into a file the scraper expects.
      # To refresh the session: log in locally with SCRAPER_HEADFUL=1, solve the
      # captcha, then `base64 -i .loyverse-session.json | pbcopy` and update
      # the LOYVERSE_SESSION_B64 secret.
      - name: Restore Loyverse session
        env:
          LOYVERSE_SESSION_B64: ${{ secrets.LOYVERSE_SESSION_B64 }}
        run: |
          if [ -z "$LOYVERSE_SESSION_B64" ]; then
            echo "::error::LOYVERSE_SESSION_B64 secret is not set."
            exit 1
          fi
          printf '%s' "$LOYVERSE_SESSION_B64" | base64 -d > .loyverse-session.json
          echo "Session file size: $(wc -c < .loyverse-session.json) bytes"

      - name: Scrape purchase orders
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DEBUG:        "1"
        run: npm run orders -- ${{ github.event.inputs.mode || '' }}

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
          retention-days: 7
