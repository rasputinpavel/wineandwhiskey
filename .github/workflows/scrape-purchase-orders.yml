name: Scrape Purchase Orders

on:
  schedule:
    # Every 8 hours: 06:30 / 14:30 / 22:30 Bangkok (UTC+7) = 23:30 / 07:30 / 15:30 UTC.
    # One run right after close (22:30 BKK) for same-evening day totals.
    - cron: "30 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Extra args (e.g. '--all', '--no-discover', '--discover-pages 10', '--po PO2890')"
        required: false
        default: ""
      force_login:
        description: "Ignore the stored session and re-login with email/password (verifies captcha-free CI login)"
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Decode the persisted Loyverse session into a file the scraper expects.
      # Secret content is base64-encoded; the inner payload may be either raw
      # JSON or gzip'd JSON — we auto-detect via the gzip magic bytes (1f 8b)
      # so refreshing with `base64 < .loyverse-session.json | pbcopy` or
      # `gzip -c -9 .loyverse-session.json | base64 | pbcopy` both work.
      - name: Restore Loyverse session
        env:
          LOYVERSE_SESSION_B64:    ${{ secrets.LOYVERSE_SESSION_B64 }}
          LOYVERSE_SESSION_B64_GZ: ${{ secrets.LOYVERSE_SESSION_B64_GZ }}
        run: |
          if [ -n "$LOYVERSE_SESSION_B64_GZ" ]; then
            payload="$LOYVERSE_SESSION_B64_GZ"
          elif [ -n "$LOYVERSE_SESSION_B64" ]; then
            payload="$LOYVERSE_SESSION_B64"
          else
            echo "::error::Neither LOYVERSE_SESSION_B64_GZ nor LOYVERSE_SESSION_B64 secret is set."
            exit 1
          fi
          printf '%s' "$payload" | base64 -d > .loyverse-session.bin
          magic=$(head -c 2 .loyverse-session.bin | xxd -p)
          if [ "$magic" = "1f8b" ]; then
            gunzip -c .loyverse-session.bin > .loyverse-session.json
          else
            mv .loyverse-session.bin .loyverse-session.json
          fi
          rm -f .loyverse-session.bin
          echo "Session file size: $(wc -c < .loyverse-session.json) bytes"
          if ! head -c 1 .loyverse-session.json | grep -q '{'; then
            echo "::error::Decoded session is not JSON (first byte is not '{'). Check the secret value."
            exit 1
          fi

      # Loyverse's session cookie carries a hard 30-day expiry that is NOT
      # extended by use, so a stored session always dies a month after it was
      # minted. The scraper therefore re-logins with email/password when it
      # finds the session dead — and we hash the session file around the run so
      # the next step knows whether a new one needs persisting.
      - name: Scrape purchase orders
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOYVERSE_EMAIL:       ${{ secrets.LOYVERSE_EMAIL }}
          LOYVERSE_PASSWORD:    ${{ secrets.LOYVERSE_PASSWORD }}
          SCRAPER_FORCE_LOGIN:  ${{ github.event.inputs.force_login == 'true' && '1' || '' }}
          SCRAPER_DEBUG:        "1"
        run: |
          before=$(md5sum .loyverse-session.json 2>/dev/null | cut -d' ' -f1)
          npm run orders -- ${{ github.event.inputs.mode || '' }}
          after=$(md5sum .loyverse-session.json 2>/dev/null | cut -d' ' -f1)
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "SESSION_CHANGED=1" >> "$GITHUB_ENV"
            echo "Session was refreshed during this run — it will be written back to the secret."
          fi

      # A session minted on the runner lives only on its disk. Without this the
      # next run would restore the old, expired one from the secret and log in
      # again — every 8 hours, forever. Needs a PAT with Secrets: read/write
      # (SESSION_REFRESH_PAT); without it we just warn and keep the manual path.
      - name: Persist refreshed session into LOYVERSE_SESSION_B64
        if: env.SESSION_CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.SESSION_REFRESH_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Session was refreshed but SESSION_REFRESH_PAT is not set — the secret still holds the old session. Add the PAT or refresh the secret by hand."
            exit 0
          fi
          base64 -w0 .loyverse-session.json | gh secret set LOYVERSE_SESSION_B64
          echo "::notice::LOYVERSE_SESSION_B64 updated with the freshly minted session."

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
          retention-days: 7
