name: Scrape Purchase Orders

on:
  schedule:
    # Every 8 hours: 00:00 / 08:00 / 16:00 Bangkok (UTC+7) = 17 / 01 / 09 UTC
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Extra args (e.g. '--all', '--no-discover', '--discover-pages 10', '--po PO2890')"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Decode the persisted Loyverse session into a file the scraper expects.
      # Secret content is base64-encoded; the inner payload may be either raw
      # JSON or gzip'd JSON — we auto-detect via the gzip magic bytes (1f 8b)
      # so refreshing with `base64 < .loyverse-session.json | pbcopy` or
      # `gzip -c -9 .loyverse-session.json | base64 | pbcopy` both work.
      - name: Restore Loyverse session
        env:
          LOYVERSE_SESSION_B64:    ${{ secrets.LOYVERSE_SESSION_B64 }}
          LOYVERSE_SESSION_B64_GZ: ${{ secrets.LOYVERSE_SESSION_B64_GZ }}
        run: |
          if [ -n "$LOYVERSE_SESSION_B64_GZ" ]; then
            payload="$LOYVERSE_SESSION_B64_GZ"
          elif [ -n "$LOYVERSE_SESSION_B64" ]; then
            payload="$LOYVERSE_SESSION_B64"
          else
            echo "::error::Neither LOYVERSE_SESSION_B64_GZ nor LOYVERSE_SESSION_B64 secret is set."
            exit 1
          fi
          printf '%s' "$payload" | base64 -d > .loyverse-session.bin
          magic=$(head -c 2 .loyverse-session.bin | xxd -p)
          if [ "$magic" = "1f8b" ]; then
            gunzip -c .loyverse-session.bin > .loyverse-session.json
          else
            mv .loyverse-session.bin .loyverse-session.json
          fi
          rm -f .loyverse-session.bin
          echo "Session file size: $(wc -c < .loyverse-session.json) bytes"
          if ! head -c 1 .loyverse-session.json | grep -q '{'; then
            echo "::error::Decoded session is not JSON (first byte is not '{'). Check the secret value."
            exit 1
          fi

      - name: Scrape purchase orders
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DEBUG:        "1"
        run: npm run orders -- ${{ github.event.inputs.mode || '' }}

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
          retention-days: 7
