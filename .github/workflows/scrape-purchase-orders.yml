name: Scrape Purchase Orders

on:
  schedule:
    # 02:00 Bangkok time = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode: leave empty for incremental, or '--all'"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape purchase orders
        env:
          LOYVERSE_EMAIL:          ${{ secrets.LOYVERSE_EMAIL }}
          LOYVERSE_PASSWORD:       ${{ secrets.LOYVERSE_PASSWORD }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID:        ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:    ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:    ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: npm run orders -- ${{ github.event.inputs.mode || '' }}
