name: Sync Receipts

on:
  schedule:
    # 02:30 Bangkok time = 19:30 UTC
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode: leave empty for incremental, or '--all'"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync receipts to Supabase
        env:
          LOYVERSE_API_TOKEN:   ${{ secrets.LOYVERSE_API_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync_receipts.ts ${{ github.event.inputs.mode || '' }}
